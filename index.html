<style>

<script>
const TAU = Math.PI * 2;

function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s = s * 1664525 + 1013904223 >>> 0;
    return s / 4294967296;
  };
}

function genPoints(count, clusters, seed) {
  const r = rng(seed), cs = [];
  for (let k = 0; k < clusters; k++) cs.push({
    x: (r() * 2 - 1) * .72,
    y: (r() * 2 - 1) * .72,
    s: .08 + r() * .26
  });
  const g = () => (r() + r() + r() + r() - 2) / 2, pts = [];
  for (let i = 0; i < count; i++) {
    const c = cs[Math.floor(r() * clusters)] || cs[0];
    pts.push([ c.x + g() * c.s, c.y + g() * c.s ]);
  }
  return pts;
}

function hexBin(pts, r) {
  const dx = r * 2 * Math.sin(Math.PI / 3), dy = r * 1.5, bins = new Map;
  for (const [x, y] of pts) {
    let py = y / dy, pj = Math.round(py), px = x / dx - (pj & 1 ? .5 : 0), pi = Math.round(px);
    const py1 = py - pj;
    if (Math.abs(py1) * 3 > 1) {
      const px1 = px - pi, pi2 = pi + (px < pi ? -1 : 1) / 2, pj2 = pj + (py < pj ? -1 : 1), px2 = px - pi2, py2 = py - pj2;
      if (px1 * px1 + py1 * py1 > px2 * px2 + py2 * py2) {
        pi = pi2 + (pj & 1 ? 1 : -1) / 2;
        pj = pj2;
      }
    }
    const key = pi + ',' + pj;
    let b = bins.get(key);
    if (!b) {
      b = {
        x: (pi + (pj & 1 ? .5 : 0)) * dx,
        y: pj * dy,
        count: 0
      };
      bins.set(key, b);
    }
    b.count++;
  }
  return [ ...bins.values() ];
}

function polyVerts(R, n) {
  const v = [];
  for (let i = 0; i < n; i++) {
    const a = TAU * i / n;
    v.push([ Math.sin(a) * R, -Math.cos(a) * R ]);
  }
  return v;
}

function footprint(R, n, round) {
  n = Math.max(3, Math.round(n));
  const V = polyVerts(R, n);
  if (!(round > .001)) return V;
  const out = [], K = 4, sub = (a, b) => [ a[0] - b[0], a[1] - b[1] ], ln = a => Math.hypot(a[0], a[1]);
  for (let i = 0; i < n; i++) {
    const p = V[(i + n - 1) % n], c = V[i], q = V[(i + 1) % n], dp = sub(p, c), dq = sub(q, c), lp = ln(dp), lq = ln(dq), cut = Math.min(lp, lq) * .5 * round;
    const a1 = [ c[0] + dp[0] / lp * cut, c[1] + dp[1] / lp * cut ], a2 = [ c[0] + dq[0] / lq * cut, c[1] + dq[1] / lq * cut ];
    out.push(a1);
    for (let s = 1; s < K; s++) {
      const t = s / K;
      out.push([ (1 - t) * (1 - t) * a1[0] + 2 * (1 - t) * t * c[0] + t * t * a2[0], (1 - t) * (1 - t) * a1[1] + 2 * (1 - t) * t * c[1] + t * t * a2[1] ]);
    }
    out.push(a2);
  }
  return out;
}

function rotX(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return {
    x: p.x,
    y: p.y * c - p.z * s,
    z: p.y * s + p.z * c
  };
}

function rotY(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return {
    x: p.x * c + p.z * s,
    y: p.y,
    z: -p.x * s + p.z * c
  };
}

const lerp = (a, b, t) => a + (b - a) * t;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hmap(t, mode) {
  t = clamp(t, 0, 1);
  if (mode === 'sqrt') return Math.sqrt(t);
  if (mode === 'log') return Math.log1p(t * 9) / Math.log(10);
  return t;
}

const _mc = v => v < 0 ? 0 : v > 1 ? 1 : v;

const ARCHETYPES = {
  slow: {
    speed: .55,
    ease: t => .5 * (1 - Math.cos(Math.PI * t))
  },
  fast: {
    speed: 1.9,
    ease: t => 1 - Math.pow(1 - t, 3)
  },
  soft: {
    speed: .85,
    ease: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
  },
  raw: {
    speed: 1.3,
    ease: t => t
  }
};

function motionResolve(x, y) {
  x = _mc(x);
  y = _mc(y);
  const w = {
    slow: (1 - x) * (1 - y),
    fast: x * (1 - y),
    soft: (1 - x) * y,
    raw: x * y
  }, A = ARCHETYPES;
  const speed = w.slow * A.slow.speed + w.fast * A.fast.speed + w.soft * A.soft.speed + w.raw * A.raw.speed;
  const ease = t => {
    t = _mc(t);
    return w.slow * A.slow.ease(t) + w.fast * A.fast.ease(t) + w.soft * A.soft.ease(t) + w.raw * A.raw.ease(t);
  };
  return {
    speed: speed,
    ease: ease
  };
}

function speedToX(target, y) {
  const A = ARCHETYPES, left = (1 - y) * A.slow.speed + y * A.soft.speed, right = (1 - y) * A.fast.speed + y * A.raw.speed;
  return Math.abs(right - left) < 1e-6 ? .5 : _mc((target - left) / (right - left));
}

function revealFactors(t, easeFn, hold) {
  const c01 = x => x < 0 ? 0 : x > 1 ? 1 : x, E = x => easeFn ? easeFn(c01(x)) : c01(x);
  const S = .5, RISE = 1, HOLD = hold != null ? hold : 1.6, holdEnd = S + RISE + HOLD, EXIT = .7, GAP = .5, cycle = holdEnd + EXIT + GAP;
  let exitK = 0;
  if (state.anim.loop) {
    t = (t % cycle + cycle) % cycle;
    if (t > holdEnd) exitK = c01((t - holdEnd) / EXIT);
  } else if (t > holdEnd) t = holdEnd;
  const keep = 1 - E(exitK);
  return {
    baseK: E(t / S) * keep,
    rise: d => E((t - S - d * .5 * RISE) / (RISE * .5)) * keep,
    labK: E((t - S - .35) / .4) * keep,
    yawOff: (1 - E(t / S)) * Math.PI * .5 - E(exitK) * Math.PI * .35,
    tiltOff: (1 - E(t / S)) * (14 * Math.PI / 180)
  };
}

  H = innerHeight;
  cv.width = W * dpr;

const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();

const INK = css('--ink'), MUTED = css('--muted'), ACC = css('--accent'), PAPER = css('--paper');

const gray = g => {
  const v = Math.round(clamp(g, 0, 1) * 255);
  return `rgb(${v},${v},${v})`;
};

function hexRGB(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return {
    r: parseInt(h.slice(0, 2), 16),
    g: parseInt(h.slice(2, 4), 16),
    b: parseInt(h.slice(4, 6), 16)
  };
}

function mix(a, b, t) {
  const c = typeof a === 'string' ? hexRGB(a) : a, d = typeof b === 'string' ? hexRGB(b) : b;
  return `rgb(${Math.round(lerp(c.r, d.r, t))},${Math.round(lerp(c.g, d.g, t))},${Math.round(lerp(c.b, d.b, t))})`;
}

function colFor(t) {
  const u = state.hex.invert ? 1 - t : t;
  if (state.hex.palette === 'gray') {
    const v = lerp(state.hex.gLight, state.hex.gDark, u);
    return {
      top: gray(v),
      side: gray(v * state.hex.side)
    };
  }
  const to = state.hex.palette === 'accent' ? ACC : INK, top = mix(PAPER, to, .14 + .86 * u), side = mix(top, '#000000', (1 - state.hex.side) * .55);
  return {
    top: top,
    side: side
  };
}

let dirty = true, bins = [], maxC = 1;

function rebuild() {
  bins = hexBin(genPoints(Math.round(state.data.count), Math.round(state.data.clusters), state.data.seed), state.hex.size);
  maxC = bins.reduce((m, b) => Math.max(m, b.count), 1);
  let cx = 0, cy = 0;
  for (const b of bins) {
    cx += b.x;
    cy += b.y;
  }
  cx /= bins.length || 1;
  cy /= bins.length || 1;
  let mr = 1e-6;
  for (const b of bins) {
    b._r = Math.hypot(b.x - cx, b.y - cy);
    if (b._r > mr) mr = b._r;
  }
  for (const b of bins) b.d = b._r / mr;
  dirty = false;
}

function cam() {
  const c = state.cam;
  return {
    yaw: c.yaw * Math.PI / 180,
    tilt: c.tilt * Math.PI / 180,
    dist: c.dist,
    fov: Math.min(W, H) / 2.6 * c.dist
  };
}

function vT(v, cm) {
  return rotX(rotY(v, cm.yaw), cm.tilt);
}

function toScr(x, y, z, cm) {
  const q = vT({
    x: x,
    y: y,
    z: z
  }, cm);
  const s = cm.fov / (cm.dist + q.z);
  return {
    x: W / 2 + q.x * s,
    y: H / 2 - q.y * s,
    z: q.z
  };
}

let hitCols = [], lastT = performance.now();

function buildFaces(cm, R) {
  const cols = [];
  hitCols = [];
  const HX = state.hex, taper = HX.style === 'peaks' ? Math.max(HX.taper, .82) : HX.taper, floors = HX.style === 'floors' ? Math.max(2, Math.round(HX.floors)) : 1;
  const edges = HX.edges;
  for (const b of bins) {
    const t = hmap(b.count / maxC, HX.hmap);
    const rad = Math.max(.012, HX.size * (1 + HX.sizeVar * (t - .5)));
    const h = HX.height * (HX.minH + (1 - HX.minH) * t) * (R ? R.rise(b.d) : 1);
    const fpB = footprint(rad, HX.sides, HX.round), fpT = footprint(rad * (1 - taper), HX.sides, HX.round), M = fpB.length;
    const bot = fpB.map(v => toScr(b.x + v[0], 0, b.y + v[1], cm)), top = fpT.map(v => toScr(b.x + v[0], h, b.y + v[1], cm));
    const bc = toScr(b.x, 0, b.y, cm), tc = toScr(b.x, h, b.y, cm);
    hitCols.push({
      b: b,
      sx: tc.x,
      sy: tc.y
    });
    const {top: cTop, side: cSide} = colFor(t), selTop = state.sel === b;
    const cf = [];
    const avg = a => {
      let s = 0;
      for (const p of a) s += p.z;
      return s / a.length;
    };
    if (h > .001) {
      for (let i = 0; i < M; i++) {
        const j = (i + 1) % M, pts = [ bot[i], bot[j], top[j], top[i] ];
        cf.push({
          pts: pts,
          fill: cSide,
          so: edges ? .1 : 0,
          z: (bot[i].z + bot[j].z + top[i].z + top[j].z) / 4
        });
      }
      if (floors > 1) {
        for (let k = 1; k < floors; k++) {
          const f = k / floors, ring = footprint(rad * (1 - taper * f), HX.sides, HX.round).map(v => toScr(b.x + v[0], h * f, b.y + v[1], cm));
          cf.push({
            pts: ring,
            fill: null,
            so: .13,
            z: avg(ring)
          });
        }
      }
      cf.push({
        pts: bot,
        fill: cSide,
        so: edges ? .1 : 0,
        z: avg(bot)
      });
    }
    cf.push({
      pts: top,
      fill: selTop ? ACC : cTop,
      so: edges ? .14 : 0,
      z: avg(top)
    });
    cf.sort((a, c) => c.z - a.z);
    cols.push({
      key: bc.z,
      cf: cf
    });
  }
  cols.sort((a, c) => c.key - a.key);
  const faces = [];
  for (const col of cols) for (const f of col.cf) faces.push(f);
  return faces;
}

function frame(now) {
  const dt = Math.min((now - lastT) / 1e3, .05) * state.motion.speed;
  lastT = now;
  state.anim.t += dt;
  if (dirty) rebuild();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  const cm = cam();
  const R = revealFactors(state.anim.t, motionResolve(state.motion.x, state.motion.y).ease, state.anim.hold);
  cm.yaw += R.yawOff;
  cm.tilt += R.tiltOff;
  if (state.hex.base && R.baseK > .01) {
    ctx.strokeStyle = INK;
    ctx.globalAlpha = .05 * R.baseK;
    const g = footprint(state.hex.size, 6, 0);
    for (const b of bins) {
      ctx.beginPath();
      g.forEach((v, i) => {
        const p = toScr(b.x + v[0], 0, b.y + v[1], cm);
        i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  const faces = buildFaces(cm, R);
  for (const f of faces) {
    ctx.beginPath();
    f.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    if (f.fill) {
      ctx.fillStyle = f.fill;
      ctx.fill();
    }
    if (f.so > 0) {
      ctx.strokeStyle = INK;
      ctx.globalAlpha = f.so;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  if (state.sel) {
    const c = hitCols.find(x => x.b === state.sel);
    if (c) {
      const txt = state.sel.count + ' pts';
      ctx.font = '11px ui-monospace,monospace';
      const w = ctx.measureText(txt).width + 14;
      let bx = Math.min(W - w - 8, c.sx + 8), by = c.sy - 24;
      ctx.beginPath();
      ctx.roundRect(bx, by, w, 20, 7);
      ctx.fillStyle = INK;
      ctx.fill();
      ctx.fillStyle = PAPER;
      ctx.fillText(txt, bx + 7, by + 14);
    }
  }
  ctx.font = '11px ui-monospace,monospace';
  ctx.fillStyle = INK;
  ctx.globalAlpha = .65 * R.labK;
  ctx.textAlign = 'right';
  ctx.fillText(String(state.data.title).toUpperCase() + ' · ' + state.data.count + ' pts · ' + bins.length + ' bins · max ' + maxC, W - 16, 26);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
  if (!document.body.classList.contains('noui')) drawGizmo(cm);
  requestAnimationFrame(frame);
}

const GIZMO_R = 46;

function gizmoCenter() {
  return {
    x: W - 72,
    y: H - 72
  };
}

function drawGizmo(cm) {
  const g = gizmoCenter(), r = GIZMO_R;
  ctx.beginPath();
  ctx.arc(g.x, g.y, r, 0, TAU);
  ctx.fillStyle = PAPER;
  ctx.globalAlpha = .85;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = .2;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.font = '9px ui-monospace,monospace';
  const axes = [ {
    v: {
      x: 1,
      y: 0,
      z: 0
    },
    t: 'X',
    c: ACC
  }, {
    v: {
      x: 0,
      y: 1,
      z: 0
    },
    t: 'Y',
    c: INK
  }, {
    v: {
      x: 0,
      y: 0,
      z: 1
    },
    t: 'Z',
    c: MUTED
  } ].map(a => ({
    ...a,
    q: vT(a.v, cm)
  })).sort((a, b) => b.q.z - a.q.z);
  for (const a of axes) {
    const L = r * .7, ex = g.x + a.q.x * L, ey = g.y - a.q.y * L;
    ctx.globalAlpha = .25;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.lineTo(g.x - a.q.x * L, g.y + a.q.y * L);
    ctx.strokeStyle = a.c;
    ctx.setLineDash([ 2, 3 ]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = a.q.z < 0 ? .95 : .45;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.lineTo(ex, ey);
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ex, ey, 2.5, 0, TAU);
    ctx.fillStyle = a.c;
    ctx.fill();
    ctx.fillText(a.t, ex + 4, ey - 4);
    ctx.globalAlpha = 1;
  }
}

requestAnimationFrame(frame);

let dragging = false, gizmoDrag = false, px = 0, py = 0, moved = 0;

cv.addEventListener('pointerdown', e => {
  const g = gizmoCenter();
  gizmoDrag = Math.hypot(e.clientX - g.x, e.clientY - g.y) < GIZMO_R;
  dragging = true;
  px = e.clientX;
  py = e.clientY;
  moved = 0;
});

addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  px = e.clientX;
  py = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  const k = gizmoDrag ? 2 : 1;
  state.cam.yaw += dx * .3 * k;
  state.cam.tilt -= dy * .25 * k;
  syncPanel();
});

addEventListener('pointerup', e => {
  if (dragging && moved < 5 && !gizmoDrag) {
    let best = null, bd = 1e9;
    for (const c of hitCols) {
      const d = Math.hypot(c.sx - e.clientX, c.sy - e.clientY);
      if (d < bd) {
        bd = d;
        best = c.b;
      }
    }
    state.sel = bd < 40 ? best : null;
  }
  dragging = false;
  gizmoDrag = false;
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  state.cam.dist = clamp(state.cam.dist * Math.exp(e.deltaY * .0012), 2, 7);

const setPath = (k, v) => {

};

function buildSliders(elId, arr) {
  const el = $('#' + elId);
  [ ...el.querySelectorAll('.row') ].forEach(r => r.remove());
  for (const [key, name, min, max, stp] of arr) {
    const row = document.createElement('div');
    row.className = 'row';
    if (min === 0 && max === 1 && stp === 1) {
      row.classList.add('toggle');
      row.innerHTML = `<label>${name}</label><input type="checkbox" class="sw">`;
      const cb = row.querySelector('input');
      cb.checked = !!getPath(key);
      cb.dataset.key = key;
      cb.addEventListener('change', () => setPath(key, cb.checked ? 1 : 0));
      el.appendChild(row);
      continue;
    }
    row.innerHTML = `<label>${name}</label><input type="range" min="${min}" max="${max}" step="${stp}"><input type="number" min="${min}" max="${max}" step="${stp}">`;
    const inp = row.querySelector('input[type=range]'), val = row.querySelector('input[type=number]'), fmt = x => +(+x).toFixed(stp < 1 ? 3 : 0);
    inp.value = getPath(key);
    val.value = fmt(getPath(key));
    inp.dataset.key = key;
    inp.addEventListener('input', () => {
      setPath(key, +inp.value);
      val.value = fmt(inp.value);
    });
    val.addEventListener('change', () => {
      const x = parseFloat(val.value);
      if (isFinite(x)) {
        setPath(key, x);
        inp.value = Math.max(min, Math.min(max, x));
      }
    });
    el.appendChild(row);
  }
}

function svgOut() {

  const cm = cam();
  const faces = buildFaces(cm, null);
  const P = pts => 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join('L') + 'Z';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${PAPER}"/>`;
  for (const f of faces) {
    s += `<path d="${P(f.pts)}" fill="${f.fill || 'none'}"${f.so > 0 ? ` stroke="${INK}" stroke-opacity="${f.so}"` : ''}/>`;
  }
  s += `</svg>`;
  const a = document.createElement('a');
  a.download = 'hexbin.svg';
  a.href = URL.createObjectURL(new Blob([ s ], {
    type: 'image/svg+xml'
  }));
  a.click();
}

(function() {
  const rp = $('#mReplay'), lp = $('#mLoop'), hd = $('#mHold');
  if (rp) rp.addEventListener('click', () => {

    lp.setAttribute('aria-pressed', state.anim.loop ? 'true' : 'false');
    if (!state.anim.loop) state.anim.t = 0;
  });
})();

(function initMotionPad() {
  const cINK = INK, cMUT = MUTED, cACC = ACC, cLINE = css('--line');
  const padEl = $('#mpad'), padC = $('#mpadc'), prevC = $('#mprevc'), easeSel = $('#mEase'), pc = padC.getContext('2d'), rc = prevC.getContext('2d');
  const PRESETS_XY = {
    balanced: [ .5, .5 ],
    slow: [ .12, .12 ],
    fast: [ .88, .12 ],
    soft: [ .12, .88 ],
    raw: [ .88, .88 ],
    gentle: [ .3, .7 ],
    snappy: [ .72, .28 ]
  };
  const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
  function nearest() {
    let b = 'balanced', bd = 1e9;
    for (const k in PRESETS_XY) {
      const dx = PRESETS_XY[k][0] - state.motion.x, dy = PRESETS_XY[k][1] - state.motion.y, d = dx * dx + dy * dy;
      if (d < bd) {
        bd = d;
        b = k;
      }
    }
    return b;
  }
  function fit(c) {
    const dpr = Math.min(devicePixelRatio || 1, 2), r = c.getBoundingClientRect();
    c.width = Math.max(1, r.width * dpr);
    c.height = Math.max(1, r.height * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    return {
      w: r.width,
      h: r.height
    };
  }
  let PD = fit(padC), RD = fit(prevC), phase = 0, lastM = performance.now();
  addEventListener('resize', () => {
    PD = fit(padC);
    RD = fit(prevC);
  });
  setTimeout(() => {
    PD = fit(padC);
    RD = fit(prevC);
  }, 90);
  const cur = () => motionResolve(state.motion.x, state.motion.y);
  function drawPad() {
    const {w: w, h: h} = PD, c = cur();
    pc.clearRect(0, 0, w, h);
    pc.strokeStyle = cLINE;
    pc.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const g = i / 4;
      pc.globalAlpha = .6;
      pc.beginPath();
      pc.moveTo(g * w, 0);
      pc.lineTo(g * w, h);
      pc.stroke();
      pc.beginPath();
      pc.moveTo(0, g * h);
      pc.lineTo(w, g * h);
      pc.stroke();
    }
    pc.globalAlpha = 1;
    const p0 = 13;
    pc.strokeStyle = cACC;
    pc.globalAlpha = .28;
    pc.lineWidth = 2;
    pc.beginPath();
    for (let i = 0; i <= 60; i++) {
      const t = i / 60, xx = p0 + t * (w - 2 * p0), yy = h - p0 - c.ease(t) * (h - 2 * p0);
      i ? pc.lineTo(xx, yy) : pc.moveTo(xx, yy);
    }
    pc.stroke();
    pc.globalAlpha = .1;
    pc.setLineDash([ 3, 4 ]);
    pc.beginPath();
    pc.moveTo(p0, h - p0);
    pc.lineTo(w - p0, p0);
    pc.stroke();
    pc.setLineDash([]);
    pc.globalAlpha = 1;
    const px = state.motion.x * w, py = (1 - state.motion.y) * h;
    pc.strokeStyle = cINK;
    pc.globalAlpha = .22;
    pc.beginPath();
    pc.moveTo(px, 0);
    pc.lineTo(px, h);
    pc.moveTo(0, py);
    pc.lineTo(w, py);
    pc.stroke();
    pc.globalAlpha = 1;
    pc.fillStyle = cINK;
    pc.beginPath();
    pc.arc(px, py, 6, 0, TAU);
    pc.fill();
    pc.fillStyle = '#fff';
    pc.beginPath();
    pc.arc(px, py, 2.2, 0, TAU);
    pc.fill();
  }
  function drawPrev(dt) {
    const {w: w, h: h} = RD, c = cur();
    rc.clearRect(0, 0, w, h);
    const y0 = h / 2, x0 = 13, x1 = w - 13;
    rc.strokeStyle = cLINE;
    rc.lineWidth = 1;
    rc.beginPath();
    rc.moveTo(x0, y0);
    rc.lineTo(x1, y0);
    rc.stroke();
    phase += dt * state.motion.speed * .6;
    if (phase > 1.35) phase -= 1.35;
    const p = cl(phase);
    rc.fillStyle = cMUT;
    rc.globalAlpha = .45;
    rc.beginPath();
    rc.arc(x0 + p * (x1 - x0), y0 + 8, 3, 0, TAU);
    rc.fill();
    rc.globalAlpha = 1;
    rc.fillStyle = cINK;
    rc.beginPath();
    rc.arc(x0 + c.ease(p) * (x1 - x0), y0 - 8, 4.6, 0, TAU);
    rc.fill();
  }
  function commit() {
    state.motion.speed = +cur().speed.toFixed(2);
    syncPanel();
    easeSel.value = nearest();
    drawPad();
  }
  function fromEvt(e) {
    const r = padEl.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width,
      y: 1 - (e.clientY - r.top) / r.height
    };
  }
  let drag = false;
  padEl.addEventListener('pointerdown', e => {
    drag = true;
    padEl.setPointerCapture(e.pointerId);
    const p = fromEvt(e);
    state.motion.x = cl(p.x);
    state.motion.y = cl(p.y);
    commit();
  });
  padEl.addEventListener('pointermove', e => {
    if (drag) {
      const p = fromEvt(e);
      state.motion.x = cl(p.x);
      state.motion.y = cl(p.y);
      commit();
    }
  });
  padEl.addEventListener('pointerup', () => drag = false);
  padEl.addEventListener('pointercancel', () => drag = false);
  const spInp = $('#gMotionSliders input[type=range]');
  if (spInp) spInp.addEventListener('input', () => {
    state.motion.x = speedToX(+spInp.value, state.motion.y);
    easeSel.value = nearest();
    drawPad();
  });
  easeSel.addEventListener('change', () => {
    const q = PRESETS_XY[easeSel.value] || [ .5, .5 ];
    state.motion.x = q[0];
    state.motion.y = q[1];
    commit();
  });
  (function ml(now) {
    const dt = Math.min((now - lastM) / 1e3, .05);
    lastM = now;
    drawPad();
    drawPrev(dt);
    requestAnimationFrame(ml);
  })(performance.now());
  commit();
})();

resize();
</script>
